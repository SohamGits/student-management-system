{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-header">
                <h1>Create Account</h1>
                <p>Register as a student or teacher</p>
            </div>

            {% if error %}
                <div class="error-message">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST" action="{% url 'register' %}">
                {% csrf_token %}

                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input
                        type="date"
                        id="dob"
                        name="dob"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        required
                    >
                </div>
                <div class="role-selection">
                    <p>Select your role:</p>
                    <label>
                        <input
                            type="radio"
                            name="role"
                            value="student"
                            onchange="toggleTeacherKey()"
                            required
                        >
                        Student
                    </label>
                    <label>
                        <input
                            type="radio"
                            name="role"
                            value="teacher"
                            onchange="toggleTeacherKey()"
                        >
                        Teacher
                    </label>

                </div>

                <div
                    class="form-group"
                    id="teacher-key-container"
                    style="display: none;"
                >
                    <label for="teacher_key">Classroom Key</label>

                    <input
                        type="text"
                        id="teacher_key"
                        name="teacher_key"
                        placeholder="Enter teacher classroom key"
                    >

                    <small>
                        Required only for teacher registration.
                    </small>
                </div>

                <button type="submit" class="primary-button">
                    Create Account
                </button>

            </form>
            <div class="auth-footer">
                <p>
                    Already have an account?
                    <a href="{% url 'login' %}">
                        Login
                    </a>
                </p>
            </div>
        </div>
    </div>
    <script>
        function toggleTeacherKey() {
            const teacherRole = document.querySelector(
                'input[name="role"][value="teacher"]'
            );

            const teacherKeyContainer = document.getElementById(
                "teacher-key-container"
            );

            const teacherKeyInput = document.getElementById(
                "teacher_key"
            );

            if (teacherRole.checked) {
                teacherKeyContainer.style.display = "block";
                teacherKeyInput.required = true;
            } else {
                teacherKeyContainer.style.display = "none";
                teacherKeyInput.required = false;
                teacherKeyInput.value = "";
            }
        }
    </script>

</body>
</html>
