{% extends 'firstapp/base.html' %}
{% load static %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center py-5 auth-wrapper">

    <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

        <div class="card shadow-sm">
            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">
                    <h1 class="h3 fw-bold">Reset Password</h1>
                    <p class="text-muted mb-0">
                        Enter your email and date of birth to set a new password
                    </p>
                </div>

                <div id="reset-error" class="alert alert-danger d-none"
                     role="alert"></div>

                <form id="forgot-form" method="POST"
                      action="{% url 'forgot_password' %}">
                    {% csrf_token %}

                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="email"
                               name="email" placeholder="Email" required>
                        <label for="email">Email</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="date" class="form-control" id="dob"
                               name="dob" placeholder="Date of Birth" required>
                        <label for="dob">Date of Birth</label>
                    </div>

                    <div class="input-group mb-3">
                        <div class="form-floating">
                            <input type="password" class="form-control" id="new_password"
                                   name="new_password" placeholder="New Password" required>
                            <label for="new_password">New Password</label>
                        </div>
                        <button type="button"
                                class="btn btn-outline-secondary password-toggle"
                                data-target="new_password"
                                aria-label="Show password">
                            <svg class="icon-show" xmlns="http://www.w3.org/2000/svg"
                                 width="22" height="22" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round"
                                 aria-hidden="true">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="icon-hide d-none" xmlns="http://www.w3.org/2000/svg"
                                 width="22" height="22" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round"
                                 aria-hidden="true">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>

                    <div class="input-group mb-4">
                        <div class="form-floating">
                            <input type="password" class="form-control"
                                   id="confirm_password" name="confirm_password"
                                   placeholder="Confirm Password" required>
                            <label for="confirm_password">Confirm Password</label>
                        </div>
                        <button type="button"
                                class="btn btn-outline-secondary password-toggle"
                                data-target="confirm_password"
                                aria-label="Show password">
                            <svg class="icon-show" xmlns="http://www.w3.org/2000/svg"
                                 width="22" height="22" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round"
                                 aria-hidden="true">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="icon-hide d-none" xmlns="http://www.w3.org/2000/svg"
                                 width="22" height="22" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round"
                                 aria-hidden="true">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>

                    <button type="submit" id="reset-button"
                            class="btn btn-primary w-100 py-2">
                        Reset password
                    </button>
                </form>

                <div class="text-center mt-4">
                    <a href="{% url 'login' %}" class="text-decoration-none">
                        Back to login
                    </a>
                </div>

            </div>
        </div>

    </div>

</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/password-toggle.js' %}"></script>
<script src="{% static 'js/forgot-password.js' %}"></script>
{% endblock %}
