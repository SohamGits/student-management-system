<div class="role-toggle" role="radiogroup" aria-label="Select role">
    <span class="role-toggle-thumb" aria-hidden="true"></span>

    <input type="radio" class="role-toggle-input" name="role"
           id="role-student" value="student" checked required>
    <label class="role-toggle-option" for="role-student">Student</label>

    <input type="radio" class="role-toggle-input" name="role"
           id="role-teacher" value="teacher">
    <label class="role-toggle-option" for="role-teacher">Teacher</label>
</div>
